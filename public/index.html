<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e8" />
    <meta
      name="description"
      content="智播中枢 · 面向直播电商的分布式多智能体全流程运营平台。四 Actor 对等协同、MCP 工具层、A2A 协议、实时流式决策与因果复盘。"
    />
    <title>智播中枢 · ZHIBO NEXUS</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/light.css" />
    <link rel="stylesheet" href="/css/experience.css" />
  </head>
  <body data-theme="light">
    <div class="ambient" aria-hidden="true">
      <canvas id="particles"></canvas>
      <div class="aurora aurora-a"></div>
      <div class="aurora aurora-b"></div>
      <div class="aurora aurora-c"></div>
      <div class="grid-plate"></div>
      <div class="grain"></div>
    </div>
    <div id="app" class="app-mount">
      <div class="boot-screen">
        <div class="boot-mark">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="boot-word">ZHIBO NEXUS</div>
        <div class="boot-line">正在接入分布式中枢</div>
      </div>
    </div>
    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
    <div id="drawer-root" class="drawer-root" aria-hidden="true"></div>
    <div id="palette-root" class="palette-root" aria-hidden="true"></div>
    <div id="confirm-root" class="confirm-root" aria-hidden="true"></div>
    <div id="map-root" class="map-root" aria-hidden="true"></div>
    <div id="demo-root" class="demo-root"></div>
    <div id="coach-root" class="coach-root" aria-hidden="true"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
